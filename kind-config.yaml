kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # postgres
      - containerPort: 30432
        hostPort: 5432
        listenAddress: 127.0.0.1
        protocol: TCP
      # redis
      - containerPort: 30379
        hostPort: 6379
        listenAddress: 127.0.0.1
        protocol: TCP
      # rabbit AMQP
      - containerPort: 30672
        hostPort: 5672
        listenAddress: 127.0.0.1
        protocol: TCP
      # rabbit management UI
      - containerPort: 31672
        hostPort: 15672
        listenAddress: 127.0.0.1
        protocol: TCP
      # headlamp
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
