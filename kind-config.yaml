kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30432
        hostPort: 5432
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30379
        hostPort: 6379
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30672
        hostPort: 5672
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 31672
        hostPort: 15672
        listenAddress: 127.0.0.1
        protocol: TCP
