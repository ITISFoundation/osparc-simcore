apiVersion: v1
kind: Secret
metadata:
  name: redis
type: Opaque
stringData:
  REDIS_PASSWORD: {{ .Values.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: NodePort
  ports:
    - port: 6379
      targetPort: 6379
      nodePort: 30379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: valkey/valkey:7.2.14@sha256:1bbb912679bea3ec2c1b21af3860beb4397774e9118eddad4ae50d8e97fabb99
          command:
            - sh
            - -c
            - exec valkey-server --save 60 1 --loglevel verbose --databases 13 --appendonly yes --appendfsync everysec --requirepass "$REDIS_PASSWORD"
          envFrom:
            - secretRef:
                name: redis
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli --no-auth-warning --pass "$REDIS_PASSWORD" ping
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
