suite: ingress
templates:
  - templates/ingress.yaml
values:
  - values/base.yaml
release:
  name: my-svc
tests:
  - it: renders nothing without ingresses
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one Ingress per entry
    set:
      ingresses:
        - paths:
            - path: /
              pathType: Prefix
        - nameSuffix: admin
          ingressClassName: nginx
          serviceName: other
          annotations:
            foo: bar
          paths:
            - path: /admin
              pathType: Exact
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.name
          value: my-svc
      - documentIndex: 0
        equal:
          path: spec.ingressClassName
          value: traefik
      - documentIndex: 0
        notExists:
          path: metadata.annotations
      - documentIndex: 0
        equal:
          path: spec.rules[0].http.paths[0]
          value:
            path: /
            pathType: Prefix
            backend:
              service:
                name: my-svc
                port:
                  name: http
      - documentIndex: 1
        equal:
          path: metadata.name
          value: my-svc-admin
      - documentIndex: 1
        equal:
          path: spec.ingressClassName
          value: nginx
      - documentIndex: 1
        equal:
          path: metadata.annotations
          value:
            foo: bar
      - documentIndex: 1
        equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: other
