suite: env secret
templates:
  - templates/secret.yaml
values:
  - values/base.yaml
release:
  name: my-svc
tests:
  - it: renders nothing when secretEnv is empty
    asserts:
      - hasDocuments:
          count: 0

  - it: quotes values and drops nulls
    set:
      secretEnv:
        PASSWORD: s3cr3t
        PORT: 5432
        UNSET: null
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: my-svc-env
      - equal:
          path: stringData
          value:
            PASSWORD: s3cr3t
            PORT: "5432"
