{{- $secretEnvs := list }}
{{- range .Values.env }}
{{- if .sensitive }}{{ $secretEnvs = append $secretEnvs . }}{{ end }}
{{- end }}
{{- if $secretEnvs }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simcore-service.envSecretName" . }}
  labels:
    {{- include "simcore-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $secretEnvs }}
  {{ .name }}: {{ .value | default "" | toString | quote }}
  {{- end }}
{{- end }}
