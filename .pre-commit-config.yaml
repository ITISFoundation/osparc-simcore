# See https://pre-commit.com/hooks.html for more hooks
exclude: "^.venv$|^.cache$|^.pytest_cache$|^services/static-webserver/client/qx_libs/"
fail_fast: false
default_language_version:
  python: python3.14
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.5
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '^services/static-webserver/client/source/translation/.*\.po$|^packages/common-library/src/common_library/locale/.*\.po$'
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: debug-statements
      - id: no-commit-to-branch
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        name: pyright
        types: [file, python]
  - repo: local
    hooks:
      - id: pytest-testit
        name: pytest-testit
        language: script
        types: [file, python]
        entry: scripts/precommit/pytest-testit.bash
  - repo: local
    hooks:
      - id: validate-docker-compose
        name: validate-docker-compose
        language: script
        types: [file]
        entry: scripts/precommit/validate-docker-compose.bash
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.0
    hooks:
      - id: typos
        name: spellchecker
        exclude: "(^|/)generated_models/|^services/static-webserver/client/source/translation/.*\\.po$|^packages/common-library/src/common_library/locale/.*\\.po$"
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        name: markdown-linter
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yaml-linter
        args: ["--config-file", ".yamllint.yaml"]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint
  - repo: local
    hooks:
      - id: check-lychee-version-sync
        name: check lychee version sync
        language: script
        entry: scripts/precommit/check_lychee_version_sync.py
        files: ^\.pre-commit-config\.yaml$
        pass_filenames: false
  - repo: https://github.com/lycheeverse/lychee.git
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        name: markdown-link-checker
        # LYCHEE_VERSION must stay the first argument and must match `rev`, so the
        # script hook does not infer its version with `git describe`. That inference
        # fails during `git commit` because git exports GIT_DIR into hooks and the
        # describe then targets this repo instead of the hook's cache clone.
        # `pre-commit autoupdate` does not bump this argument; the
        # check-lychee-version-sync hook above keeps the two in sync.
        args: ["LYCHEE_VERSION=0.24.2", "--config", ".lychee.toml"]
        types_or: [markdown]
