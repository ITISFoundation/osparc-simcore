# Self-hosted Renovate, replacing the Mend-hosted app, and the automation around
# its pull requests. Three jobs:
# - renovate: runs Renovate as the osparc Renovate GitHub App, which executes
#   .github/renovate/resync_lockfiles.py as a post-upgrade task, so the layered
#   pip-compile lockfiles are fixed inside Renovate's own commit (Mend-hosted
#   Renovate cannot run commands, and a fixup commit by another author blocks both
#   CI, which waits for approval, and Renovate, which stops updating an "edited"
#   branch);
# - review-gate: marks Renovate's draft PRs ready once their checks are done
#   (.github/renovate/review_gate.sh);
# - milestone: puts every new Renovate PR into the current milestone.
# How a PR gets from here to master is in docs/renovate.md.
#
# Setup (org owner): a GitHub App with the permissions listed in
# https://docs.renovatebot.com/modules/platform/github/#running-as-a-github-app,
# installed on this repository only; its client ID in the repository variable
# RENOVATE_APP_CLIENT_ID and its private key in the repository secret
# RENOVATE_APP_PRIVATE_KEY.
#
# Needs an Actions event policy that explicitly allows pull_request_target on
# this file's path. GitHub blocks the event on public repositories by default,
# and policies match file paths, so renaming this file means updating the
# policy as well: https://gh.io/securely-using-pull_request_target
name: Chore Renovate

on:
  schedule:
    # renovate: nightly at 02:17 UTC (03:17/04:17 in Zurich), off the top of the
    # hour when GitHub's scheduler is busiest
    - cron: "17 2 * * *"
    # review-gate
    - cron: "*/15 * * * *"
  push:
    # renovate: a merged dependency change makes the other open Renovate branches
    # stale or conflicted; Renovate rebases and regenerates them right away instead
    # of the next night. The paths are the files Renovate writes (the last block of
    # .github/CODEOWNERS) and its configuration
    branches:
      - master
    paths:
      - "**/requirements/**"
      - "**/Dockerfile*"
      - "**/docker-compose*.yml"
      - ".python-version"
      - "api/tests/requirements.txt"
      - "package.json"
      - "package-lock.json"
      - ".renovaterc.jsonc"
      - ".github/renovate/**"
      - ".github/workflows/**"
  issues:
    # renovate: a person ticking a box on the Dependency Dashboard (approve an
    # update, retry, ...) gets a run right away instead of waiting for the night
    types:
      - edited
  pull_request_target:
    # pull_request_target (not pull_request) so that no code of the PR is ever run.
    # edited -> renovate: the "rebase/retry" box of a Renovate PR;
    # opened -> milestone
    types:
      - opened
      - edited
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        type: choice
        default: renovate
        options:
          - renovate
          - review-gate
      log-level:
        description: Renovate log level
        type: choice
        default: info
        options:
          - info
          - debug
      dry-run:
        description: Only log what Renovate would do (no branches, PRs or issues)
        type: boolean
        default: false

permissions: {}

jobs:
  renovate:
    # forks have no App credentials. Edits only count when a person (not Renovate,
    # which rewrites its issue and PR bodies on every run) edits the Dependency
    # Dashboard or ticks the rebase/retry box of a Renovate PR
    if: >
      github.repository == 'ITISFoundation/osparc-simcore' &&
      ((github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') ||
       github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.job == 'renovate') ||
       (github.event.sender.type == 'User' && github.event.action == 'edited' &&
        ((github.event_name == 'issues' &&
          github.event.issue.user.login == 'osparc-simcore-renovate[bot]' &&
          github.event.issue.title == 'Dependency Dashboard') ||
         (github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login == 'osparc-simcore-renovate[bot]' &&
          contains(github.event.pull_request.body, '- [x] <!-- rebase-check -->')))))
    # one run at a time; GitHub keeps a single pending run, so a burst of merges
    # collapses into one follow-up run
    concurrency:
      group: ${{ github.workflow }}-renovate
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # the App installation token expires after one hour
    timeout-minutes: 60
    steps:
      - name: create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-administration: read
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-metadata: read
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: checkout Renovate configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # not pull_request.base.sha: it lags behind master for long-lived Renovate PRs, which
          # would run Renovate with an outdated configuration
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate/global-config.json5
          docker-cmd-file: .github/renovate/entrypoint.bash
          # the entrypoint installs system packages, then drops to the unprivileged user
          docker-user: root
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # empty (i.e. not set) unless requested
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}

  review-gate:
    # runs as the Renovate App, not as github-actions: a GitHub App cannot change
    # the draft state of a pull request opened by another App, so marking ready
    # with github.token fails with "Resource not accessible by integration"
    # (markPullRequestReadyForReview). The App that owns the PRs can.
    if: >
      github.repository == 'ITISFoundation/osparc-simcore' &&
      ((github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.job == 'review-gate'))
    concurrency:
      group: ${{ github.workflow }}-review-gate
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: create Renovate App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the App token must not end up in the git credential store; the
          # script only talks to the API through gh
          persist-credentials: false

      - name: run review gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BOT: osparc-simcore-renovate[bot]
          FAIL_COOLDOWN_HOURS: 3
        run: ./.github/renovate/review_gate.sh

  milestone:
    # puts every new Renovate PR into the current milestone: the open milestone with
    # the earliest due date, overdue or not, because a sprint milestone stays in use
    # until it is closed. Renovate's own `milestone` option only takes a fixed
    # milestone number. No code of the PR is checked out or run
    if: >
      github.repository == 'ITISFoundation/osparc-simcore' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'opened' &&
      github.event.pull_request.user.login == 'osparc-simcore-renovate[bot]' &&
      github.event.pull_request.milestone == null
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: set the current milestone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          milestone=$(gh api "repos/${REPO}/milestones?state=open&per_page=100" \
            --jq '[.[] | select(.due_on != null)] | sort_by(.due_on) | first | .number // empty')
          if [ -z "$milestone" ]; then
            echo "No open milestone with a due date, leaving PR #${PR_NUMBER} without milestone"
            exit 0
          fi
          gh api --method PATCH "repos/${REPO}/issues/${PR_NUMBER}" -F "milestone=${milestone}" \
            --jq '"PR #\(.number) added to milestone \(.milestone.title)"'
