# Self-hosted Renovate, replacing the Mend-hosted app.
# It runs as the osparc Renovate GitHub App and executes
# .github/renovate/resync-lockfiles.bash as a post-upgrade task, so the layered
# pip-compile lockfiles are fixed inside Renovate's own commit (Mend-hosted Renovate
# cannot run commands, and a fixup commit by another author blocks both CI, which
# waits for approval, and Renovate, which stops updating an "edited" branch).
#
# Setup (org owner): a GitHub App with the permissions listed in
# https://docs.renovatebot.com/modules/platform/github/#running-as-a-github-app,
# installed on this repository only; its client ID in the repository variable
# RENOVATE_APP_CLIENT_ID and its private key in the repository secret
# RENOVATE_APP_PRIVATE_KEY.
name: Chore Renovate

on:
  schedule:
    # hourly, off the top of the hour when GitHub's scheduler is busiest
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        default: info
        options:
          - info
          - debug
      dry-run:
        description: Only log what Renovate would do (no branches, PRs or issues)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    # forks have no App credentials
    if: github.repository == 'ITISFoundation/osparc-simcore'
    runs-on: ubuntu-latest
    # the App installation token expires after one hour
    timeout-minutes: 60
    steps:
      - name: create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: checkout Renovate configuration
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: run Renovate
        uses: renovatebot/github-action@v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate/global-config.json5
          docker-cmd-file: .github/renovate/entrypoint.bash
          # the entrypoint installs system packages, then drops to the unprivileged user
          docker-user: root
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          # empty (i.e. not set) unless requested
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
