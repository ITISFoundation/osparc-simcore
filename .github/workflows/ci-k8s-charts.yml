name: CI K8s Charts

on:
  pull_request:
    paths:
      - ".github/workflows/ci-k8s-charts.yml"
      - "charts/**"
      - "k8s/**"
      - "services/**/helmfile*"
      - "services/**/helm-values*"
      - ".env-devel"
      - "scripts/makefiles/k8s.mk"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-unittest:
    name: "[unit] helm-unittest"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: # keep versions in sync with scripts/makefiles/k8s.mk
          version: v3.22.1

      - name: Setup helm-unittest
        env:
          HELM_UNITTEST_VERSION: v1.2.1 # keep in sync with scripts/makefiles/k8s.mk
        run: |
          helm plugin install --version "${HELM_UNITTEST_VERSION}" \
            https://github.com/helm-unittest/helm-unittest

      - name: helm-unittest
        run: make -C k8s helm-unittest

  helmfile-manifests:
    name: "[lint] helmfile manifests"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      TEMPLATES_DIR: /tmp/templates
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup helmfile
        uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
        with: # keep versions in sync with scripts/makefiles/k8s.mk
          helmfile-version: v1.1.6
          helm-version: v3.22.1
          helmfile-auto-init: "false" # avoid https://github.com/helmfile/helmfile-action/issues/816
          helmfile-args: --version

      - name: helmfile-lint
        run: make -C k8s helmfile-lint

      - name: helmfile-template
        run: make -C k8s helmfile-template HELMFILE_COMMAND_FLAGS="--output-dir=${TEMPLATES_DIR}"

      - name: upload-manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-manifests-${{ github.sha }}
          path: ${{ env.TEMPLATES_DIR }}
          if-no-files-found: error # an empty render would make kubeconform pass without checking anything

  kubeconform:
    name: "[kubeconform] kubernetes ${{ matrix.kubernetes-version }}"
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: helmfile-manifests
    strategy:
      matrix:
        kubernetes-version: ["1.36.1", "1.37.1"]
      fail-fast: false
    env:
      TEMPLATES_DIR: /tmp/templates
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download-manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: k8s-manifests-${{ github.sha }}
          path: ${{ env.TEMPLATES_DIR }}

      - name: Setup kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0 # keep in sync with scripts/makefiles/k8s.mk
        # https://github.com/yannh/kubeconform/issues/200#issuecomment-1546763389
        run: |
          go install -ldflags "-X main.version=${KUBECONFORM_VERSION}" \
            "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: kubeconform
        env:
          KUBERNETES_VERSION: ${{ matrix.kubernetes-version }}
        run: make -C k8s kubeconform
