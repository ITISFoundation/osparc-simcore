# Renders all helmfile charts without a cluster to catch chart, values and env errors.
name: CI K8s Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - "k8s/**"
      - "services/**/helmfile*"
      - "services/**/helm-values*"
      - ".env-devel"
      - "scripts/makefiles/k8s.mk"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubernetes-unit-tests:
    timeout-minutes: 10
    name: "[unit] kubernetes ${{ matrix.kubernetes-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kubernetes-version: ["1.36.1", "1.37.1"]
      fail-fast: false
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup helmfile
        uses: helmfile/helmfile-action@1f44bcb43e5fb17ecb2685d8b6081ec5f6aa5fcf # v2.4.7
        with:
          helmfile-version: v1.1.6 # keep in sync with scripts/makefiles/k8s.mk
          helm-version: v3.20.2 # keep in sync with scripts/makefiles/k8s.mk
          helmfile-auto-init: "false" # avoid https://github.com/helmfile/helmfile-action/issues/816
          helmfile-args: --version

      - name: Setup kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0 # keep in sync with scripts/makefiles/k8s.mk
        run: |
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: helmfile-lint
        run: make -C k8s helmfile-lint

      - name: helmfile-template
        run: make -C k8s helmfile-template

      - name: kubeconform
        env:
          KUBERNETES_VERSION: ${{ matrix.kubernetes-version }}
          TEMPLATES_DIR: /tmp/templates
        run: |
          make -C k8s helmfile-simcore-template HELMFILE_COMMAND_FLAGS="--output-dir=${TEMPLATES_DIR}"
          make -C k8s kubeconform KUBERNETES_VERSION="${KUBERNETES_VERSION}" TEMPLATES_DIR="${TEMPLATES_DIR}"
