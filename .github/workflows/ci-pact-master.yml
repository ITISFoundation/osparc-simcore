# This workflow holds jobs which are required to pass before merging into master

name: CI PACT Master
on:
  push:
    branches:
      - "master"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pact-tests:
    timeout-minutes: 10
    name: "Run PACT tests"
    runs-on: ubuntu-latest
    env:
      # secrets can be set in settings/secrets on github
      PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
      PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
    steps:
      - name: checkout source branch
        uses: actions/checkout@v7.0.1
      - name: setup python environment
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: resolve uv version
        id: uv-version
        run: echo "version=$(tr -d '[:space:]' < requirements/UV_VERSION)" >> "$GITHUB_OUTPUT"
      - name: install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: false
      - name: Run pact tests
        run: |
          make devenv
          source .venv/bin/activate
          cd services/api-server
          make install-ci
          make test-pacts
