name: Chore Rerun Flaky Jobs
# A failed CI Build Test job is usually flaky: an extra push or a manual "Re-run
# failed jobs" restarts the whole workflow to get one retry. On a failed CI run of
# a non-draft pull request from a fork into this repository, or of a Renovate pull
# request, re-trigger only the failed jobs; green jobs keep their results, and draft
# PRs are left alone. Runs on master pushes and on other in-repo branches are not
# retried.
# More than 3 failed jobs, a failed python-linting (pylint) job, or a failed
# typecheck step is not treated as flaky and stays red. The second failure of a
# commit stays red for Mergify to dequeue and a human to investigate.
# GitHub only fires workflow_run for workflows that exist on the default branch, so
# this file takes effect once merged to master.
on:
  workflow_run:
    workflows:
      - CI Build Test
    types:
      - completed

permissions:
  contents: read

jobs:
  rerun:
    name: Rerun failed jobs
    runs-on: ubuntu-latest
    # failed pull_request runs on a pull request from a fork (head_repository
    # differs from this one) or on a Renovate pull request (head_branch prefix),
    # first attempt only: run_attempt is 1-based and increments per re-run, so one
    # retry per commit and no loop. Checking the repository at all: a fork that
    # synced master would rerun its own runs, where this token cannot write.
    if: >-
      github.repository == 'ITISFoundation/osparc-simcore' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt < 2 &&
      (github.event.workflow_run.head_repository.full_name != 'ITISFoundation/osparc-simcore' ||
      startsWith(github.event.workflow_run.head_branch, 'renovate/'))
    permissions:
      actions: write # only needed to re-trigger runs, nothing else
    steps:
      # the workflow_run event runs against the default branch, so this checks
      # out master, where the script lives once this workflow is merged
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # workflow_run.pull_requests is empty for a fork's PR: PR_NUMBER
          # comes out empty and the head repo/branch fall back to the run's.
          # The script then looks the PR up by head owner and branch.
          PR_HEAD_REPO: ${{ github.event.workflow_run.pull_requests[0].head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          PR_HEAD_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref || github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: ./.github/scripts/rerun_flaky_jobs.sh
