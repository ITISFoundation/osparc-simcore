name: Chore Rerun Flaky Jobs
# CI Build Test has flaky test jobs. Today one failed job means an extra push or a
# manual "Re-run failed jobs" click, and both restart the whole workflow. On a failed
# CI run of a non-draft pull request from a fork into this repository, re-trigger only
# the failed jobs; green jobs keep their results, and a draft PR is left alone since
# nobody waits on its checks.
# Do this once per commit, and only for failures that look flaky. Runs with more
# than 3 failed jobs, a failed python-linting (pylint) job, or a failed typecheck
# step are deterministic, and those runs stay red. The second failure of the same
# commit is assumed real and stays red for Mergify to dequeue and a human to
# investigate.
# NOTE: GitHub only fires workflow_run for workflows that exist on the default
# branch, so this file takes effect only once merged to master.
on:
  workflow_run:
    workflows:
      - CI Build Test
    types:
      - completed

permissions:
  contents: read

jobs:
  rerun:
    name: Rerun failed jobs
    runs-on: ubuntu-latest
    # failed pull request runs only, from a fork into this repository (a
    # cross-repository PR has head_repository != this one), and only their
    # first attempt (run_attempt is 1-based and increments on every re-run, so
    # this caps automation at one retry per commit and cannot loop). The
    # repository check keeps forks that synced master from rerunning their own
    # runs, where the token could not write anyway.
    if: >-
      github.repository == 'ITISFoundation/osparc-simcore' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt < 2 &&
      github.event.workflow_run.head_repository.full_name != 'ITISFoundation/osparc-simcore'
    permissions:
      actions: write # only needed to re-trigger runs, nothing else
    steps:
      # the workflow_run event runs against the default branch, so this checks
      # out master, where the script lives once this workflow is merged
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # owner/repo and branch of the PR head. workflow_run.pull_requests
          # only lists same-repository PRs, so for a fork's PR it is empty and
          # the number has to be looked up from these instead
          PR_HEAD_REPO: ${{ github.event.workflow_run.pull_requests[0].head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          PR_HEAD_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref || github.event.workflow_run.head_branch }}
          # empty for a fork's PR (pull_requests is empty there); the script
          # then finds the PR from PR_HEAD_REPO:PR_HEAD_BRANCH
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: ./.github/scripts/rerun_flaky_jobs.sh
