name: Chore Rerun Flaky Jobs
# CI Build Test has flaky test jobs; a single failed job forces a push or a
# manual "Re-run failed jobs" click, which restarts everything. On a failed
# pull request run, re-trigger ONLY the failed jobs (green jobs keep their
# results), once per commit, and only for failures that look flaky: runs with
# more than 3 failed jobs, or with python-linting (pylint) or a typecheck step
# failing, are deterministic and left red. A second failure of the same commit
# is assumed real and left red for Mergify to dequeue and a human to look at.
# NOTE: GitHub only fires workflow_run for workflows that exist on the default
# branch, so this file takes effect only once merged to master.
on:
  workflow_run:
    workflows:
      - CI Build Test
    types:
      - completed

permissions:
  contents: read

jobs:
  rerun:
    name: Rerun failed jobs
    runs-on: ubuntu-latest
    # failed pull request runs only, and only their first attempt (run_attempt
    # is 1-based and increments on every re-run, so this caps automation at one
    # retry per commit and cannot loop)
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.run_attempt < 2
    permissions:
      actions: write # only needed to re-trigger runs, nothing else
    steps:
      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          # skip stale runs: a newer commit was pushed while this one was still red,
          # its own run already supersedes it
          if [ "$HEAD_SHA" != "$PR_HEAD_SHA" ]; then
            echo "run $RUN_ID is on $HEAD_SHA, PR head is now $PR_HEAD_SHA; not rerunning"
            exit 0
          fi
          FAILED_JOBS="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure")]')"
          N_FAILED="$(jq 'length' <<<"$FAILED_JOBS")"

          # 0 failures (e.g. cancelled run) or more than 3: the latter is most likely
          # a real integration/build breakage, not isolated flakiness
          if [ "$N_FAILED" -eq 0 ] || [ "$N_FAILED" -gt 3 ]; then
            echo "$N_FAILED failed jobs (want 1..3); not rerunning"
            exit 0
          fi

          # lint failures are deterministic: the pylint job is "[unit] python-linting"
          if jq -e 'any(.[]; .name | test("python-linting"))' <<<"$FAILED_JOBS" >/dev/null; then
            echo "python-linting failed; not rerunning"
            exit 0
          fi

          # a failed "typecheck" step (pyright) is deterministic too
          if jq -e 'any(.[]; .steps[]? | select(.name == "typecheck" and .conclusion == "failure"))' \
            <<<"$FAILED_JOBS" >/dev/null; then
            echo "a typecheck step failed; not rerunning"
            exit 0
          fi

          echo "rerunning $N_FAILED failed job(s):"
          jq -r '.[] | " - " + .name' <<<"$FAILED_JOBS"
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
