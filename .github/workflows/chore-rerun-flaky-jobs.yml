name: Chore Rerun Flaky Jobs
# A failed CI Build Test job is usually flaky: an extra push or a manual "Re-run
# failed jobs" restarts the whole workflow to get one retry. On a failed CI run of
# a pull request from a fork into this repository, of a Renovate pull request, or
# of a push to master, re-trigger only the failed jobs; green jobs keep their
# results. Draft PRs from forks are left alone, but Renovate pull requests are
# drafts by default, so their drafts are retried too. CI runs on other in-repo
# branches are not retried.
# More than 3 failed jobs, a failed python-linting (pylint) job, or a failed
# typecheck step is not treated as flaky and stays red. The second failure of a
# commit stays red for Mergify to dequeue and a human to investigate.
# GitHub only fires workflow_run for workflows that exist on the default branch, so
# this file takes effect once merged to master. A run can also be retried by hand:
# start this workflow manually with the failed CI Build Test run ID; the same
# flakiness guards apply, only the once-per-commit rule is bypassed.
on:
  workflow_run:
    workflows:
      - CI Build Test
    types:
      - completed
  workflow_dispatch:
    inputs:
      run-id:
        description: Run ID of the failed CI Build Test run to rerun failed jobs of
        required: true
        type: string

permissions:
  contents: read

jobs:
  rerun:
    name: Rerun failed jobs
    runs-on: ubuntu-latest
    # failed pull_request runs on a pull request from a fork (head_repository
    # differs from this one) or on a Renovate pull request (head_branch prefix), and
    # failed push runs on master, first attempt only: run_attempt is 1-based and
    # increments per re-run, so one retry per commit and no loop. Checking the
    # repository at all: a fork that synced master would rerun its own runs, where
    # this token cannot write. A manual start skips these event filters (it is a
    # human overriding the once-per-commit rule); the script's own guards still run.
    if: >-
      github.repository == 'ITISFoundation/osparc-simcore' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2 &&
      ((github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.head_repository.full_name != 'ITISFoundation/osparc-simcore' ||
      startsWith(github.event.workflow_run.head_branch, 'renovate/'))) ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'))))
    permissions:
      actions: write # needed to read and re-trigger runs, nothing else
    steps:
      # the workflow_run event runs against the default branch, so this checks
      # out master, where the script lives once this workflow is merged
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Put RUN_ID, HEAD_SHA, CI_EVENT and the PR head into the job environment
      # for both trigger kinds, so the rerun step below has one env source. On a
      # manual start they come from the run looked up by the given run ID; on a
      # workflow_run event they come from the payload.
      - name: Resolve run context
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run-id }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "run ID must be numeric, got: $RUN_ID" >&2
            exit 1
          fi
          RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          if [ "$(jq -r .name <<<"$RUN")" != "CI Build Test" ]; then
            echo "run $RUN_ID belongs to '$(jq -r .name <<<"$RUN")', not CI Build Test" >&2
            exit 1
          fi
          {
            echo "RUN_ID=$RUN_ID"
            echo "HEAD_SHA=$(jq -r .head_sha <<<"$RUN")"
            echo "CI_EVENT=$(jq -r .event <<<"$RUN")"
            echo "PR_HEAD_REPO=$(jq -r .head_repository.full_name <<<"$RUN")"
            echo "PR_HEAD_BRANCH=$(jq -r .head_branch <<<"$RUN")"
            # empty: the script looks the pull request up from head owner:branch
            echo "PR_NUMBER="
          } >>"$GITHUB_ENV"

      - name: Map workflow_run context
        if: github.event_name != 'workflow_dispatch'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          # workflow_run.pull_requests is empty for a fork's PR: PR_NUMBER
          # comes out empty and the head repo/branch fall back to the run's.
          # The script then looks the PR up by head owner and branch. Unused on
          # a push to master, which has no pull request to check.
          PR_HEAD_REPO: ${{ github.event.workflow_run.pull_requests[0].head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          PR_HEAD_BRANCH: ${{ github.event.workflow_run.pull_requests[0].head.ref || github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          {
            echo "RUN_ID=$RUN_ID"
            echo "HEAD_SHA=$HEAD_SHA"
            echo "CI_EVENT=$CI_EVENT"
            echo "PR_HEAD_REPO=$PR_HEAD_REPO"
            echo "PR_HEAD_BRANCH=$PR_HEAD_BRANCH"
            echo "PR_NUMBER=$PR_NUMBER"
          } >>"$GITHUB_ENV"

      - name: Rerun failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/rerun_flaky_jobs.sh
