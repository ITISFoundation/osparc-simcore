name: CI Build Test K8s
# NOTE: mirrors, job by job, the jobs of ci-build-test.yml that need no docker daemon.
# The job blocks are kept byte-identical to ci-build-test.yml so both files can be
# diffed job by job; what differs is this header (name, triggers, extra env) and that
# there is no `changes` job here: every job runs on every trigger.

on:
  pull_request:
    paths:
      - ".github/workflows/ci-build-test-k8s.yml"
      - ".github/actions/setup-k8s-toolchain/**"
      - "charts/**"
      - "k8s/**"
      - "services/**/helmfile*"
      - "services/**/helm-values*"
      - "scripts/makefiles/k8s.mk"
  workflow_dispatch:

# same as ci-build-test.yml: the codecov steps read workflow-run metadata through the API
permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  # NOTE: 'COLUMNS' is a shell env var that represents the width (number of columns)
  #       of the terminal or command-line interface in characters.
  COLUMNS: 120
  # the only reader today is tests/environment-setup/test_used_docker_compose.py
  SIMCORE_CLUSTER_ORCHESTRATOR: k8s

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test-api:
    timeout-minutes: 18 # if this timeout gets too small, then split the tests
    name: "[unit] api"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ["3.14"]
        os: [ubuntu-24.04]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup environment
        uses: $/.github/actions/setup-simcore-env
        with:
          python-version: ${{ matrix.python }}
          cache-dependency-glob: "**/api/requirements/ci.txt"
      - name: install api
        run: ./ci/github/unit-testing/api.bash install
      - name: test
        run: ./ci/github/unit-testing/api.bash test
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: unittests # optional
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          files: api/tests/junit.xml
          flags: unittests # optional
          token: ${{ secrets.CODECOV_TOKEN }}

  unit-test-api-server:
    timeout-minutes: 20
    name: "[unit] api-server"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python: ["3.14"]
        os: [ubuntu-24.04]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
