# Renovate opens every PR as a draft (draftPR in .renovaterc.jsonc), so GitHub does
# not auto-request the code owners while CI is still running. This poller marks the
# drafts ready once their checks are conclusive:
# - all checks done + green + 🤖-automerge (patch/pin/digest bumps and security fixes):
#   stays silent, the renovate-fast Mergify queue merges it without reviews;
# - all checks done + green without the label (minors/majors): the code owners get
#   requested, which is when a review is actually wanted;
# - failing checks: nothing for FAIL_COOLDOWN_HOURS on the last commit, so Renovate can
#   self-heal; then the PR is marked ready, the owners requested, the PR labeled
#   🤖-ci-failing and a comment lists the failing checks. The label keeps the request
#   from repeating; remove it to have the workflow ask again on a state change.
# The ruleset bypass that lets the fast lane merge is documented in docs/renovate.md.
name: Chore Renovate Review Gate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: renovate-review-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'ITISFoundation/osparc-simcore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BOT: osparc-simcore-renovate[bot]
      # keep in sync with the last block of .github/CODEOWNERS
      OWNERS: sanderegg,pcrespov,GitHK,giancarloromeo
      FAIL_COOLDOWN_HOURS: 3
    steps:
      - name: resolve the drafts
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$REPO" --state open --base master \
            --json number,isDraft,author \
            --jq ".[] | select(.isDraft and .author.login == \"$BOT\") | .number")
          if [ -z "$prs" ]; then
            echo "No draft Renovate PRs"
            exit 0
          fi
          for pr in $prs; do
            checks=$(gh pr checks "$pr" --repo "$REPO" --json name,bucket 2>/dev/null || true)
            if [ -z "$checks" ] || [ "$checks" = "[]" ]; then
              echo "PR #$pr: no checks reported yet"
              continue
            fi
            if jq -e 'any(.bucket == "pending")' <<<"$checks" >/dev/null; then
              echo "PR #$pr: checks still pending"
              continue
            fi
            labels=$(gh pr view "$pr" --repo "$REPO" --json labels --jq '.labels[].name')
            if jq -e 'any(.bucket == "fail")' <<<"$checks" >/dev/null; then
              # Renovate pushes fixes itself; page a human only once it stops trying
              if grep -qx '🤖-ci-failing' <<<"$labels"; then
                echo "PR #$pr: failing and already flagged"
                continue
              fi
              sha=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
              when=$(gh api "repos/${REPO}/commits/${sha}" --jq .commit.committer.date)
              age_hours=$(( ( $(date -u +%s) - $(date -u -d "$when" +%s) ) / 3600 ))
              if [ "$age_hours" -lt "$FAIL_COOLDOWN_HOURS" ]; then
                echo "PR #$pr: failing for ${age_hours}h, waiting for Renovate to fix it"
                continue
              fi
              failed=$(jq -r '.[] | select(.bucket == "fail") | "- " + .name' <<<"$checks")
              body="The checks have been failing for ${age_hours} h on the last commit and Renovate did not fix them:"$'\n\n'"${failed}"$'\n\n'"Requesting a review so someone can have a look. Remove the 🤖-ci-failing label to have the review gate workflow ask again when the state changes."
              gh pr edit "$pr" --repo "$REPO" --add-label '🤖-ci-failing'
              gh pr ready "$pr" --repo "$REPO"
              gh pr edit "$pr" --repo "$REPO" --add-reviewer "$OWNERS"
              gh pr comment "$pr" --repo "$REPO" --body "$body"
              echo "PR #$pr: failing past the cool-down, flagged the owners"
            else
              gh pr ready "$pr" --repo "$REPO"
              if grep -qx '🤖-automerge' <<<"$labels"; then
                echo "PR #$pr: green, the renovate-fast queue takes it without reviews"
              else
                gh pr edit "$pr" --repo "$REPO" --add-reviewer "$OWNERS"
                echo "PR #$pr: green, reviews requested"
              fi
            fi
          done
