# Marks Renovate's draft PRs ready once their checks have all finished; GitHub then
# requests the code owners from CODEOWNERS itself. Which PRs merge without waiting
# for that review is in the script it runs: .github/scripts/renovate_review_gate.sh
#
# The gate runs as the Renovate App, not as github-actions: a GitHub App cannot
# change the draft state of a pull request opened by another App, so marking
# ready with github.token fails with "Resource not accessible by integration"
# (markPullRequestReadyForReview). The App that owns the PRs can.
name: Chore Renovate Review Gate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: renovate-review-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'ITISFoundation/osparc-simcore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: create Renovate App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the App token must not end up in the git credential store; the
          # script only talks to the API through gh
          persist-credentials: false

      - name: Run review gate
        env:
          # the Renovate App marks its own drafts ready; github.token (the
          # github-actions App) cannot touch another App's pull requests
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BOT: osparc-simcore-renovate[bot]
          FAIL_COOLDOWN_HOURS: 3
        run: ./.github/scripts/renovate_review_gate.sh
