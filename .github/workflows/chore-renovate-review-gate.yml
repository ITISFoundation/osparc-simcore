# Marks Renovate's draft PRs ready for review once their checks are conclusive and
# requests the code owners only where a review is wanted. The branching is
# documented in the script it runs.
name: Chore Renovate Review Gate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: renovate-review-gate
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'ITISFoundation/osparc-simcore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run review gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BOT: osparc-simcore-renovate[bot]
          # keep in sync with the last block of .github/CODEOWNERS
          OWNERS: sanderegg,pcrespov,GitHK,giancarloromeo
          FAIL_COOLDOWN_HOURS: 3
        run: ./.github/scripts/renovate_review_gate.sh
