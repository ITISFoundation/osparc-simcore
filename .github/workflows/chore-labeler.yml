# Automatically apply area / type labels to a PR based on which files
# it changes (rule set: .github/labeler.yml), and put every new PR into the
# current milestone.
#
# `pull_request_target` is required so that labels can also be applied to
# PRs opened from forks (the workflow then runs with the base repo's
# permissions). The job is read-only on the checkout side and only writes
# labels through the GitHub API, so this is safe.
#
# Needs an Actions event policy that explicitly allows pull_request_target on
# this file's path. GitHub blocks the event on public repositories by default,
# and policies match file paths, so renaming this file means updating the
# policy as well: https://gh.io/securely-using-pull_request_target
name: Chore PR Auto-Labeler

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  label:
    name: Apply area labels
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Label PR based on changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          # Keep previously-set labels so that manually added labels
          # (e.g. priority, type) survive subsequent pushes.
          sync-labels: false
          dot: true

  milestone:
    # the open milestone with the earliest due date, overdue or not, because a
    # sprint milestone stays in use until it is closed. A milestone set by hand is
    # kept. No code of the PR is checked out or run
    name: Set current milestone
    if: github.event.action == 'opened' && github.event.pull_request.milestone == null
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: set the current milestone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          milestone=$(gh api "repos/${REPO}/milestones?state=open&per_page=100" \
            --jq '[.[] | select(.due_on != null)] | sort_by(.due_on) | first | .number // empty')
          if [ -z "$milestone" ]; then
            echo "No open milestone with a due date, leaving PR #${PR_NUMBER} without milestone"
            exit 0
          fi
          gh api --method PATCH "repos/${REPO}/issues/${PR_NUMBER}" -F "milestone=${milestone}" \
            --jq '"PR #\(.number) added to milestone \(.milestone.title)"'
