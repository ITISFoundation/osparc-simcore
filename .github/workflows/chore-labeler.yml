# Automatically apply area / type labels to a PR based on which files
# it changes (rule set: .github/labeler.yml), and put every new PR into the
# current milestone.
#
# `pull_request_target` is required so that labels can also be applied to
# PRs opened from forks (the workflow then runs with the base repo's
# permissions). The job is read-only on the checkout side and only writes
# labels through the GitHub API, so this is safe.
#
# Needs an Actions event policy that explicitly allows pull_request_target on
# this file's path. GitHub blocks the event on public repositories by default,
# and policies match file paths, so renaming this file means updating the
# policy as well: https://gh.io/securely-using-pull_request_target
name: Chore PR Auto-Labeler

on:
  # zizmor: ignore[dangerous-triggers] Uses trusted base-branch code and does not check out PR code.
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions: {}

jobs:
  label:
    name: Apply area labels
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Label PR based on changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          # Keep previously-set labels so that manually added labels
          # (e.g. priority, type) survive subsequent pushes.
          sync-labels: false
          dot: true

  milestone:
    # .github/labeler/set_current_milestone.sh; a milestone set by hand is kept
    name: Set current milestone
    if: github.event.action == 'opened' && github.event.pull_request.milestone == null
    # a PR is an issue to the API: pull-requests: write covers PATCH /issues/{n}
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target checks out the base branch: the script comes from
      # master, no code of the PR is checked out or run
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set the current milestone
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./.github/labeler/set_current_milestone.sh
