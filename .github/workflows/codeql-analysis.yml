#
# codeQL       : https://codeql.github.com/docs/codeql-overview/
# GH-Action    : https://github.com/github/codeql-action
# LGTM         : https://lgtm.com/#explore
# codeql-config: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-a-custom-configuration-file
#
name: CodeQL Analysis

on:
  schedule:
    - cron: "26 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript
            config-file: ./.github/codeql/codeql-config.yml
          - language: python
            config-file: ./.github/codeql/codeql-config.yml
          # workflow and action definitions are code too: this catches the
          # injection patterns that review of .github/** tends to miss
          - language: actions
            config-file: ./.github/codeql/codeql-actions-config.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL tools for scanning
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}
          config-file: ${{ matrix.config-file }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3
