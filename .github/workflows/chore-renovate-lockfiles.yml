# Renovate's pip-compile manager recompiles each requirements/*.txt file independently
# and can process them out of the Makefile's prerequisite order (_base -> _test -> _tools,
# see scripts/makefiles/requirements.mk), producing an inconsistent lockfile.
# This re-runs `make reqs upgrade="<pkg==ver ...>"` per affected requirements directory
# on Renovate's own PR branch, pinning the exact versions Renovate chose (never a bare
# `make reqs` which upgrades everything, and never a bare package name which uv would
# re-resolve to the latest release, overriding Renovate's pin) and pushes a fixup commit
# if the Makefile-ordered recompile produced a diff.
name: Chore Fix Renovate Lockfiles

on:
  pull_request:
    paths:
      - "**/requirements/*.txt"
      - "api/tests/requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-lockfiles:
    # Only act on Renovate's own same-repo branches (matches .renovaterc.jsonc branchPrefix)
    if: >
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-simcore-env
        with:
          setup-docker: 'false'
          expose-github-runtime: 'false'

      - name: re-run make reqs per requirements directory, pinning the versions Renovate chose
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # The exact "<pkg[extras]==<version>>" pins Renovate added anywhere in this
          # branch (added lines only, column-0 so indented "# via ..." provenance
          # comments are excluded). Passing bare names would let uv re-resolve to the
          # latest release instead of keeping Renovate's chosen version.
          PINS=$(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- '*.txt' \
            | grep -E '^\+[A-Za-z0-9][A-Za-z0-9._-]*(\[[^]]+\])?==' \
            | sed -E 's/^\+([A-Za-z0-9._-]+(\[[^]]+\])?==[A-Za-z0-9._+!-]+).*$/\1/' \
            | sort -u \
            | tr '\n' ' ')
          PINS="${PINS% }"

          if [ -z "$PINS" ]; then
            echo "No version pins found in the diff, nothing to propagate"
            exit 0
          fi
          echo "Propagating pins: $PINS"

          # Lockfiles generated by pip-compile, i.e. those this workflow may rewrite
          # (same set as pip-compile.managerFilePatterns in .renovaterc.jsonc)
          MANAGED='^(.*/)?requirements/[^/]+\.txt$|^(api/tests|ci/helpers|tests/environment-setup)/requirements\.txt$'
          LOCKS=$(git ls-files | grep -E "$MANAGED")

          # Directories the branch already updates ...
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E "$MANAGED" | xargs -r -n1 dirname | sort -u || true)
          # ... plus every directory whose lockfiles pin one of those packages at a
          # different version, so a version Renovate wants gone cannot stay behind in the
          # rest of the monorepo (extras are ignored, `uvicorn[standard]==1.2` matches
          # `uvicorn==1.2`)
          LAGGING=$(printf '%s\n' "$LOCKS" | xargs -r awk -v pins="$PINS" '
            BEGIN {
              npins = split(pins, pin, " ")
              for (i = 1; i <= npins; i++) {
                e = index(pin[i], "==")
                name = substr(pin[i], 1, e - 1)
                sub(/\[[^]]*\]/, "", name)
                TARGET[name] = substr(pin[i], e + 2)
              }
            }
            match($0, /^[A-Za-z0-9][A-Za-z0-9._-]*(\[[^]]+\])?==/) {
              name = substr($0, 1, RLENGTH - 2)
              sub(/\[[^]]*\]/, "", name)
              if (name in TARGET && substr($0, RLENGTH + 1) != TARGET[name])
                print FILENAME
            }' | xargs -r -n1 dirname | sort -u || true)
          DIRS=$(printf '%s\n%s\n' "$CHANGED" "$LAGGING" | grep -v '^$' | sort -u)

          echo "Regenerating lockfiles in:"
          echo "$DIRS" | sed 's/^/  - /'

          # Regenerates one directory, with the given pins or, when none are given, with a
          # full upgrade. The inputs are touched first so that the rule runs even when the
          # checkout makes the generated files look newer than them (the Makefiles' own
          # `touch` target does not exist everywhere, e.g. api/tests).
          regenerate() {
            local dir="$1"
            find "$dir" -maxdepth 1 -name '*.in' -exec touch {} +
            if [ $# -gt 1 ]; then
              make -C "$dir" reqs upgrade="$2"
            else
              make -C "$dir" reqs
            fi
          }

          # A lockfile is a hard constraint for uv, so a stale pin of an unrelated package
          # can leave the requested resolution with no solution. uv then changes nothing,
          # the branch commit comes out empty and the vulnerable version survives, so such
          # a directory is re-resolved from scratch and the requested pins are applied on
          # top of the fresh resolution afterwards. A full re-resolve moves unrelated
          # packages too, which is why it is only a fallback and is reported below.
          ESCALATED=""
          FAILED=""
          echo "| directory | targeted recompile | result |" > "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::$dir"
            if regenerate "$dir" "$PINS"; then
              echo "| $dir | ok | pinned version(s) applied |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$dir cannot resolve \"$PINS\" on top of its current pins, re-resolving it from scratch"
              git checkout -- "$dir"
              if regenerate "$dir" && regenerate "$dir" "$PINS"; then
                ESCALATED="$ESCALATED $dir"
                echo "| $dir | no solution | re-resolved from scratch (unrelated packages moved too), pinned version(s) applied |" >> "$GITHUB_STEP_SUMMARY"
              else
                FAILED="$FAILED $dir"
                echo "| $dir | no solution | re-resolve failed, lockfiles left unchanged |" >> "$GITHUB_STEP_SUMMARY"
                git checkout -- "$dir"
              fi
            fi
            echo "::endgroup::"
          done <<< "$DIRS"

          echo "ESCALATED=$ESCALATED" >> "$GITHUB_ENV"

          if [ -n "$FAILED" ]; then
            echo "::error::Could not regenerate the lockfiles in:$FAILED"
            exit 1
          fi

      - name: commit and push fix, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "fix(requirements): resync pip-compile lockfiles" \
              -m "Regenerated with the Makefile prerequisite order (_base -> _test -> _tools) using the versions Renovate chose, and propagated to every lockfile that pins them. Re-resolved from scratch (unrelated packages moved too):${ESCALATED:- none}."
            git push origin "HEAD:${PR_HEAD_REF}"
          else
            echo "Lockfiles already consistent, nothing to fix"
          fi

      - name: commit and push fix, if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "fix(requirements): resync pip-compile lockfiles"
            git push origin "HEAD:${PR_HEAD_REF}"
          else
            echo "Lockfiles already consistent, nothing to fix"
          fi
