merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 1

    queue_conditions:
      - label!=🤖-do-not-merge
      - base=master
      - -draft
      - -conflict
      - "#approved-reviews-by>=2"
      - "#changes-requested-reviews-by=0"
      - "#review-threads-unresolved=0"

    merge_conditions: # (identical to queue_conditions)
      - label!=🤖-do-not-merge
      - base=master
      - -draft
      - -conflict
      - "#approved-reviews-by>=2"
      - "#changes-requested-reviews-by=0"
      - "#review-threads-unresolved=0"

  # Low-risk Renovate bumps (patch/pin/digest, labeled by .renovaterc.jsonc) merge with
  # nobody reviewing them. The ruleset's 2-approval and code-owner gates are bypassed
  # for PRs opened by the Renovate App (see docs/renovate.md); Mergify still waits for
  # the checks to pass and refuses a conflicted or 🤖-do-not-merge PR.
  - name: renovate-fast
    batch_size: 1

    queue_conditions:
      - base=master
      - author=osparc-simcore-renovate[bot]
      - label=🤖-automerge
      - label!=security # security fixes wait for a human, even patch ones
      - label!=🤖-do-not-merge
      - -draft
      - -conflict

    merge_conditions: # (identical to queue_conditions)
      - base=master
      - author=osparc-simcore-renovate[bot]
      - label=🤖-automerge
      - label!=security
      - label!=🤖-do-not-merge
      - -draft
      - -conflict
merge_protections_settings:
  reporting_method: check-runs

pull_request_rules:
  # Low-risk Renovate bumps skip the review wait: they join renovate-fast instead of
  # the default queue. 🤖-do-not-merge still holds them back, and removing it is enough
  # to let one go.
  - name: queue green low-risk Renovate PRs without waiting for reviews
    conditions:
      - base=master
      - author=osparc-simcore-renovate[bot]
      - label=🤖-automerge
      - label!=security
      - label!=🤖-do-not-merge
      - -draft
    actions:
      queue:
        name: renovate-fast

  # A security fix that happens to be a patch carries both labels (Renovate's patch
  # rule adds 🤖-automerge, vulnerabilityAlerts adds security). It must reach the
  # default queue, which the rule below would otherwise filter out.
  - name: queue security PRs through the reviewed path
    conditions:
      - base=master
      - label=🤖-automerge
      - label=security
      - label!=🤖-do-not-merge
      - -draft
    actions:
      queue:

  # Every non-draft PR targeting master joins the default queue; nobody types
  # `@mergify queue` by hand. The queue only merges once its conditions match
  # (2 approvals, code-owner approval, checks green, ...), so Mergify waits for
  # those instead of for a human. A PR leaves the queue automatically when it
  # goes back to draft, gets 🤖-do-not-merge, or loses an approval.
  # To hold a PR back from the queue, add 🤖-do-not-merge.
  # 🤖-automerge PRs go to the renovate-fast queue by the rule above and must not
  # join this one too; the label therefore no longer means anything on a human PR.
  - name: queue every pull request that is not a draft anymore
    conditions:
      - base=master
      - label!=🤖-do-not-merge
      - label!=🤖-automerge
      - -draft
    actions:
      queue:
