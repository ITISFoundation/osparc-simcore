merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 1

    queue_conditions:
      - label=🤖-automerge
      - label!=🤖-do-not-merge
      - base=master
      - -draft
      - -conflict
      - "#approved-reviews-by>=2"
      - "#changes-requested-reviews-by=0"
      - "#review-threads-unresolved=0"

    merge_conditions: # (identical to queue_conditions)
      - label=🤖-automerge
      - label!=🤖-do-not-merge
      - base=master
      - -draft
      - -conflict
      - "#approved-reviews-by>=2"
      - "#changes-requested-reviews-by=0"
      - "#review-threads-unresolved=0"
merge_protections_settings:
  reporting_method: check-runs

pull_request_rules:
  # Renovate labels its PRs 🤖-automerge (.renovaterc.jsonc) but never merges them itself:
  # they enter the default queue as soon as they meet its queue_conditions (e.g. approvals).
  # To hold one back, add 🤖-do-not-merge.
  - name: queue Renovate PRs
    conditions:
      - author=osparc-simcore-renovate[bot]
    actions:
      queue:
