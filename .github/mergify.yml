merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 1

    queue_conditions:
      - label=🤖-automerge
      - label!=🤖-do-not-merge
      - base=master
      - -draft
      - -conflict
      - "#approved-reviews-by>=2"
      - "#changes-requested-reviews-by=0"
      - "#review-threads-unresolved=0"

    merge_conditions: # (identical to queue_conditions)
      - label=🤖-automerge
      - label!=🤖-do-not-merge
      - base=master
      - -draft
      - -conflict
      - "#approved-reviews-by>=2"
      - "#changes-requested-reviews-by=0"
      - "#review-threads-unresolved=0"
merge_protections_settings:
  reporting_method: check-runs

pull_request_rules:
  # Every pull request targeting master is a merge-queue candidate; nobody has to
  # add the 🤖-automerge label or type `@mergify queue` by hand anymore:
  #  1. 🤖-automerge is added automatically (Renovate PRs already carry it from
  #     .renovaterc.jsonc, so this is a no-op for them).
  #  2. The PR enters the default queue on its own as soon as it leaves draft —
  #     the queue only starts checking it once its queue_conditions match (2
  #     approvals, code-owner approval, checks green, ...), Mergify just waits
  #     for those instead of waiting for a human to queue it.
  #  3. Going back to draft, adding 🤖-do-not-merge, removing the label, or losing
  #     an approval unmatches queue_conditions and dequeues the PR automatically.
  # To hold one back, add 🤖-do-not-merge.
  - name: label every pull request for the merge queue
    conditions:
      - base=master
      - label!=🤖-automerge
      - label!=🤖-do-not-merge
    actions:
      label:
        add:
          - 🤖-automerge
  - name: queue every pull request that is not a draft anymore
    conditions:
      - base=master
      - label=🤖-automerge
      - -draft
    actions:
      queue:
